[project]
name = "sensor-sim"
version = "0.1.0"
description = "Mitsuba 3 computational-imaging sensor simulator"
authors = [
    { name = "Christian Moore", email = "moorechristian15@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mitsuba==3.9.1",
    "mujoco>=4.0.1",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch==2.15.0",
]

[project.scripts]
phase0 = "sensor_sim.render:main"
phase1 = "sensor_sim.phase1:main"
phase2 = "sensor_sim.phase2:main"
phase3 = "sensor_sim.phase3:main"
phase4 = "sensor_sim.phase4:main"
film-sample = "sensor_sim.film.sample:main"
film-dataset = "sensor_sim.film.dataset:main"
film-train = "sensor_sim.film.train:main"
film-sfp = "sensor_sim.film.sfp:main"
scene-gen = "sensor_sim.scene_gen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
