# Dataset v1 production contract. 64 successful scenes are selected.
# The historical component-denominator reference remains stable: false.
# Multi-object radii are at least 0.04 m so a cone can exceed 80 object-id pixels.
# generation_authorized is true for the production run that consumes this file.
mode: random
dataset_id: dataset_v1_spec
variant: cuda_ad_spectral_polarized
integrator: stokes/path
sampler: independent
rfilter: box
resolution:
- 128
- 128
spp: 256
measured_candidate_spp: 256
measured_candidate_status: selected_technical_setting
successful_scenes: 64
primary_normal: camera_space_shading
nonuniform_scale: rejected
gap_m: 0.005
visibility:
  resolution:
  - 128
  - 128
  training_min_object_pixels: 80
  fully_occluded: 0
  note: Low-visibility objects stay in the sample and are not dropped.
materials:
  primary:
  - type: dielectric
    int_ior: 1.33
    ext_ior: 1.0
  - type: dielectric
    int_ior: 1.4
    ext_ior: 1.0
  - type: dielectric
    int_ior: 1.5
    ext_ior: 1.0
  - type: dielectric
    int_ior: 1.6
    ext_ior: 1.0
  - type: dielectric
    int_ior: 1.7
    ext_ior: 1.0
  - type: pplastic
    preset: phase2
  - type: conductor
    material: Cu
  - type: roughconductor
    material: Cu
    alpha: 0.1
    distribution: beckmann
  weak_polarization:
  - type: roughconductor
    material: Au
    alpha: 0.1
    distribution: beckmann
    decision: weak_stratum
    p95_dolp_256spp: 0.174
    fraction_above_0_2: 0.0034
assets:
- sphere
- ellipsoid
- rounded_box
- capsule
- torus
- cylinder
- cone
- bumpy
object_counts:
- 1
- 2
- 3
- 4
split_modes:
- scene
- asset_instance
- asset_family
- material
- material_range
proposed_coverage_floor:
  successful_scenes: 64
  meaning: one successful scene for each family, each primary material group, and
    object counts 1 and 3. Not a frozen dataset size.
camera:
  position:
  - 0.0
  - -0.55
  - 0.32
  target:
  - 0.0
  - 0.0
  - 0.18
  up:
  - 0.0
  - 0.0
  - 1.0
  fov_deg: 55.0
  near_clip: 0.01
  far_clip: 100.0
light:
  position:
  - 0.0
  - -0.02
  - 0.598
  target:
  - 0.0
  - 0.0
  - 0.051
  up:
  - 0.0
  - 1.0
  - 0.0
  size:
  - 0.15
  - 0.15
  radiance: 18.0
seeds:
  geometry: SeedSequence([scene_seed, 1])
  material: SeedSequence([scene_seed, 2])
  scene: stream_seed(base, slot, attempt, scene)
  render: stream_seed(base, slot, attempt, render)
  rule: A failed attempt retries the same stratum slot. It does not draw a different
    family or drop an object.
retry:
  max_attempts_default: 8 times the remaining success count
  same_stratum: true
output_schema:
  channels:
  - R
  - G
  - B
  - S0.R
  - S0.G
  - S0.B
  - S1.R
  - S1.G
  - S1.B
  - S2.R
  - S2.G
  - S2.B
  - S3.R
  - S3.G
  - S3.B
  dtype: float32
  alpha: false
  stokes: signed
  scalar_stokes: mean of the three RGB-converted channels, not wavelength-resolved
ground_truth:
  primary_normal: camera_space_shading
  depth: Mitsuba distance; |position-camera| - depth = near_clip / dot(ray, camera_forward)
  ids: logical object and material ids, not prim_index
splits:
  modes:
  - scene
  - asset_instance
  - asset_family
  - material
  - material_range
  scene_disjoint_may_share_material: true
  material_holdout_may_not_share_bsdf_type: true
  built_only_from: audited completed_ids of the current run_id
run:
  run_id: uuid4 hex, required before publication
  resume: refuses a changed config hash and drops samples that fail the publication
    audit
  generation_authorized: true
  split_seed: 17011
quotas:
  status: approved
  per_family: 8
  per_material: 8
  object_counts:
    '1': 32
    '2': 16
    '3': 8
    '4': 8
  partial_occlusion: 8
  repeated_asset: 8
  note: Approved for 64 successful scenes. Gold and dragon are excluded.
generation_authorized: true
resource_estimate:
  spp256_note: Corrected Convergence v2 selected 256 spp as the lowest passing candidate.
    The historical component-denominator result remains stable false and is not overwritten.
    This note does not approve successful_scenes or authorize generation.
  historical_component_denominator: 'stable: false, retained and not overwritten'
  serial_seconds_no_retry: 1532.4
  serial_seconds_with_contingency: 2758.32
  storage_bytes_mean: 429600900.0
  storage_bytes_with_contingency: 684116196.0
  count_seconds_mean:
    '1': 12.4625
    '2': 27.75
    '3': 36.0
    '4': 50.2
  retry_sensitivity: 1.2 conservative sensitivity; the ten-scene run had zero failures
    and does not justify a zero retry rate
