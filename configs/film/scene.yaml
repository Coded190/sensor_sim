# intensity is Mitsuba area-emitter radiance, in W/sr/m^2. Blender stores
# the same lamp as power = pi * width * height * intensity watts.
# The rectangle hangs on the ceiling and aims into the open front.
lighting:
  type: area
  position:
  - 0.0
  - 0.0
  - 0.598
  intensity: 10.0
  size:
  - 0.15
  - 0.15
  up:
  - 0.0
  - 1.0
  - 0.0
room:
  reflectance: 0.8
  margin: 0.25
  floor_gap: 0.001
